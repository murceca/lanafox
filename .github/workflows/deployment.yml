name: deployment

on:
  workflow_dispatch:
    inputs:
      photo_source:
        description: "Portfolio photo source for the production static export"
        required: true
        default: "snapshot"
        type: choice
        options:
          - snapshot
          - cloudinary
      rollback_run_id:
        description: "Optional GitHub Actions run ID to roll back to an existing release artifact (leave empty to build fresh)"
        required: false
        default: ""
        type: string

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24 LTS
        if: ${{ inputs.rollback_run_id == '' }}
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        if: ${{ inputs.rollback_run_id == '' }}
        run: npm ci

      - name: Lint, typecheck, and run unit tests
        if: ${{ inputs.rollback_run_id == '' }}
        run: |
          npm run lint
          npm run typecheck
          npm test

      - name: Build production static export and API
        if: ${{ inputs.rollback_run_id == '' }}
        env:
          PHOTO_SOURCE: ${{ inputs.photo_source }}
          SITE_ORIGIN: https://lanafox.eu
          NEXT_PUBLIC_API_BASE_URL: https://api.lanafox.eu
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${{ vars.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME || secrets.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
        run: npm run build

      - name: Assemble release artifacts
        if: ${{ inputs.rollback_run_id == '' }}
        run: npm run package:release

      - name: Upload release bundle artifact
        if: ${{ inputs.rollback_run_id == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: lanafox-release-${{ github.sha }}
          path: artifacts/
          retention-days: 30

      - name: Download existing release artifact for rollback
        if: ${{ inputs.rollback_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.rollback_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: lanafox-release-*
          merge-multiple: true
          path: artifacts/

      - name: Verify release manifest
        run: |
          test -f artifacts/release.json
          test -f artifacts/web/staticwebapp.config.json
          test -f artifacts/api/host.json
          cat artifacts/release.json

      - name: Azure login via Federated OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy API to Azure Functions Flex Consumption
        uses: Azure/functions-action@v1
        with:
          app-name: lanafox-production-api
          package: artifacts/api

      - name: Deploy static export to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_DEPLOYMENT_TOKEN }}
          action: upload
          app_location: artifacts/web
          skip_app_build: true
          skip_api_build: true
