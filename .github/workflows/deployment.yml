name: deployment

on:
  workflow_dispatch:
    inputs:
      photo_source:
        description: "Portfolio photo source for the production static export"
        required: true
        default: "snapshot"
        type: choice
        options:
          - snapshot
          - cloudinary
      git_ref:
        description: "Optional Git commit SHA or tag to deploy/roll back to (leave empty for current branch HEAD)"
        required: false
        default: ""
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}

      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint, typecheck, and run unit tests
        run: |
          npm run lint
          npm run typecheck
          npm test

      - name: Build production static export and API
        env:
          PHOTO_SOURCE: ${{ inputs.photo_source }}
          SITE_ORIGIN: https://lanafox.eu
          NEXT_PUBLIC_API_BASE_URL: https://api.lanafox.eu
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${{ secrets.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME || vars.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
        run: npm run build

      - name: Assemble release artifacts
        run: npm run package:release

      - name: Verify release manifest
        run: |
          test -f artifacts/release.json
          test -f artifacts/web/staticwebapp.config.json
          test -f artifacts/api/host.json

      - name: Azure login via Federated OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Register log masks for Azure resource hostnames
        env:
          SWA_DEFAULT_HOSTNAME: ${{ secrets.AZURE_SWA_DEFAULT_HOSTNAME }}
        run: |
          set +x
          if [ -n "$SWA_DEFAULT_HOSTNAME" ]; then
            echo "::add-mask::$SWA_DEFAULT_HOSTNAME"
            swa_stem="${SWA_DEFAULT_HOSTNAME%%.*}"
            if [ -n "$swa_stem" ]; then
              echo "::add-mask::$swa_stem"
            fi
          fi
          for val in $(az functionapp list --query "[].[defaultHostName, resourceGroup, hostNames[]]" -o tsv 2>/dev/null) $(az staticwebapp list --query "[].defaultHostname" -o tsv 2>/dev/null); do
            if [ -n "$val" ] && [ "$val" != "api.lanafox.eu" ] && [ "$val" != "lanafox.eu" ]; then
              echo "::add-mask::$val"
              stem="${val%%.*}"
              if [ -n "$stem" ]; then
                echo "::add-mask::$stem"
              fi
            fi
          done

      - name: Deploy API to Azure Functions Flex Consumption
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ secrets.AZURE_FUNCTION_APP_NAME }}
          package: artifacts/api

      - name: Deploy static export to Azure Static Web Apps
        env:
          SWA_DEFAULT_HOSTNAME: ${{ secrets.AZURE_SWA_DEFAULT_HOSTNAME }}
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_DEPLOYMENT_TOKEN }}
          action: upload
          app_location: artifacts/web
          skip_app_build: true
          skip_api_build: true
