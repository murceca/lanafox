name: build-project

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify legacy environment safety
        run: npm run check:legacy-env

      - name: Build static export (fixture mode)
        run: npm run build:fixture

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run unit and contract tests
        run: npm test

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E suite against fixture export and mock API
        env:
          CI: "true"
          EXPECTED_PHOTO_COUNT: "6"
        run: npm run test:e2e

      - name: Package verifiable release artifacts
        run: npm run package:release
